# ---------------------------------------------------------------------
# Streamlit configuration for the GeekMAN companion site.
# Theme values picked to match the original streamlit.app deployment
# (deep crimson accent on a clean white background).
# ---------------------------------------------------------------------

[theme]
base               = "light"
primaryColor       = "#C8102E"
backgroundColor    = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor          = "#1F2937"
font               = "sans serif"

[server]
# Streamlit Community Cloud also lifts uploads to ~200MB, but we limit
# locally to keep memory predictable.
maxUploadSize = 50

[browser]
gatherUsageStats = false
