# ---------------------------------------------------------------------
# GeekMAN — Streamlit theme.
#
# A warm, light, professional palette:
#   - background        : #FAF7F2 (warm cream)
#   - surfaces / inputs : #FFFFFF
#   - primary accent    : #1E40AF (rich, professional navy-blue)
#   - text              : #111827 (warm charcoal, easier on eyes than pure black)
# ---------------------------------------------------------------------

[theme]
base                       = "light"
primaryColor               = "#1E40AF"
backgroundColor            = "#FAF7F2"
secondaryBackgroundColor   = "#FFFFFF"
textColor                  = "#111827"
font                       = "sans serif"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
